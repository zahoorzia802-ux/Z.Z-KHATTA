name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project and validate structure
        id: locate-project
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Gradle wrapper (gradlew) could not be found in the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found Android project root at: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::Android settings file (settings.gradle[.kts]) not found in $PROJECT_DIR"
            exit 1
          fi

          if [ -d "$PROJECT_DIR/app" ] && ([ -f "$PROJECT_DIR/app/build.gradle.kts" ] || [ -f "$PROJECT_DIR/app/build.gradle" ]); then
            echo "MODULE_DIR=$PROJECT_DIR/app" >> $GITHUB_OUTPUT
            echo "Found application module at: $PROJECT_DIR/app"
          else
            echo "::error::Application module 'app' not found in $PROJECT_DIR"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper
        run: |
          chmod +x "${{ steps.locate-project.outputs.PROJECT_DIR }}/gradlew"

      - name: Clean stale project caches and build outputs
        run: |
          PROJECT_DIR="${{ steps.locate-project.outputs.PROJECT_DIR }}"
          MODULE_DIR="${{ steps.locate-project.outputs.MODULE_DIR }}"
          echo "Cleaning stale Gradle and build caches..."
          rm -rf "$PROJECT_DIR/.gradle"
          rm -rf "$MODULE_DIR/build"

      - name: Build Debug APK
        run: |
          cd "${{ steps.locate-project.outputs.PROJECT_DIR }}"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and verify generated APK
        id: find-apk
        run: |
          MODULE_DIR="${{ steps.locate-project.outputs.MODULE_DIR }}"
          APK_FILES=$(find "$MODULE_DIR/build/outputs/apk" -type f -name "*.apk" 2>/dev/null)

          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK files were found under $MODULE_DIR/build/outputs/apk"
            exit 1
          fi

          echo "Generated APK file(s):"
          echo "$APK_FILES"

          FIRST_APK=$(echo "$APK_FILES" | head -n 1)
          echo "APK_PATH=$FIRST_APK" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate-project.outputs.MODULE_DIR }}/build/outputs/apk/**/*.apk
          if-no-files-found: error
